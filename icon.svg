<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background — warm cream with rounded corners -->
  <rect width="512" height="512" rx="96" fill="#fdf6e3"/>
  <!-- Red circle — Japanese flag motif -->
  <circle cx="256" cy="230" r="155" fill="#c0392b"/>
  <!-- Hiragana あ in white — represents Japanese language learning -->
  <text x="256" y="320" font-family="serif" font-size="210"
        fill="#ffffff" text-anchor="middle" dominant-baseline="auto">あ</text>
  <!-- Small gold accent bar at bottom -->
  <rect x="96" y="430" width="320" height="8" rx="4" fill="#e8a838"/>
</svg>
